<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022c22" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded squircle container -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- Gauge Arc -->
  <path d="M 52 35 A 36 36 0 0 1 100 70" fill="none" stroke="url(#silverGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="82" cy="48" r="3" fill="#ffffff"/>
  <line x1="82" y1="48" x2="92" y2="40" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Sleek Car Silhouette -->
  <path d="M 22 75 C 24 64 36 58 48 56 C 58 48 76 47 90 53 C 98 56 104 62 106 70 C 104 74 100 75 96 75" 
        fill="none" stroke="url(#silverGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Car Roof & Window -->
  <path d="M 48 56 C 56 49 74 48 86 54" fill="none" stroke="url(#silverGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Wrench Bar & Heads -->
  <g filter="url(#glow)">
    <!-- Wrench Shaft -->
    <rect x="36" y="78" width="56" height="8" rx="4" fill="url(#silverGrad)"/>
    <!-- Left Wrench Jaw -->
    <path d="M 38 72 C 32 72 26 77 26 82 C 26 87 32 92 38 92 C 40 92 41 91 42 90 L 36 85 C 34 83 34 81 36 79 L 42 74 Z" fill="url(#silverGrad)"/>
    <!-- Right Wrench Jaw -->
    <path d="M 90 72 C 96 72 102 77 102 82 C 102 87 96 92 90 92 C 88 92 87 91 86 90 L 92 85 C 94 83 94 81 92 79 L 86 74 Z" fill="url(#silverGrad)"/>
  </g>
  
  <!-- Lower Gauge Accent -->
  <path d="M 44 98 A 36 36 0 0 0 84 98" fill="none" stroke="url(#silverGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>